; ============================================================================
;  SatView settings  -  edit with Notepad, then type  .sat reload  in EuroScope
;  Lines starting with ; are comments.
; ============================================================================

[Satellite]
; 1 = imagery shown, 0 = hidden
Enabled=1

; 0-100: how strong the imagery is (lower = more see-through, easier to read the scope)
Opacity=45

; front = drawn at the same stage as the weather layer (above sector lines).
; back  = drawn at the background stage (may sit below the sector lines). Try both!
Layer=front

; 1 = black-and-white imagery. Helps the weather colours (and tags) stand out.
Grayscale=0

; Scaling quality of the tiles: good (default) or fast (rougher but a little lighter).
; With version 0.2 the picture is only recomposed when you pan/zoom or tiles arrive, so
; "good" is normally fine.
Quality=good

; Sharpest tile level that will ever be used (10-19).
;   15 = about 3 m per pixel, 16 = 1.6 m, 17 = 0.8 m (default), 18 = 0.4 m, 19 = 0.2 m
; Lower values use much less disk space and download less.
MaxZoom=17

; 0 = tile pixels match screen pixels. 1 = sharper but 4x more tiles. -1 = coarser and lighter.
Sharpness=0

; Size limit of the cache folder in GB (0.5 - 200). When it is full, the oldest tiles are deleted.
MaxCacheGB=8

; Folder where the tiles are saved. Empty = a folder called SatCache next to the DLL.
; Example: CacheDir=D:\SatCache
CacheDir=

; Number of tiles downloaded at the same time (1-6). 3 is polite and fast enough.
Threads=3

; Technical: the service the tiles come from (IGN Geoplateforme). Change only if tiles stop loading
; and .sat status shows an HTTP 400/404 error.
WmtsLayer=ORTHOIMAGERY.ORTHOPHOTOS
TileMatrixSet=PM_0_19
